input: |
  version: 1
  source: {urls: [https://a.test]}
  fetch: {use: provider, name: acme, cache: {ttl: 90m}}
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
  fetch:
    use: provider
    name: acme
    options: {}
    timeout: 30s
    noRedirects: false
    headers: {}
    cache: {ttl: 90m}
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
