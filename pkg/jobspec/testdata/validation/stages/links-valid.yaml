input: |
  version: 1
  source: {urls: [https://a.test]}
  fetch: {use: local}
  stages: [{use: links, include: ["**/catalogue/**"], exclude: ["**/category/**"]}]
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
  fetch:
    use: local
    profile: chrome
    timeout: 30s
    noRedirects: false
    headers: {}
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages:
    - use: links
      include: ["**/catalogue/**"]
      exclude: ["**/category/**"]
  sink:
    use: stdout
