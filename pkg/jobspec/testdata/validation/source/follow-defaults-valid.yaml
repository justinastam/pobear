input: |
  version: 1
  source: {urls: [https://a.test], follow: {selector: "li.next a@href"}}
  fetch: {use: local}
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
    follow:
      selector: "li.next a@href"
      maxPages: 100
  fetch:
    use: local
    profile: chrome
    timeout: 30s
    noRedirects: false
    headers: {}
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
