input: |
  version: 1
  source: {urls: [https://a.test]}
  fetch: {use: local}
  limits: {rps: 50, rpsPerHost: 2}
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
  fetch:
    use: local
    profile: chrome
    timeout: 30s
    noRedirects: false
    headers: {}
  limits:
    concurrency: 8
    rps: 50
    rpsPerHost: 2
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
